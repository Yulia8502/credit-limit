lock form{text-align:left;margin-top:25px}.lock label{margin:15px 0}details{margin:15px 0}summary{cursor:pointer;font-weight:600}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:520px;width:90%;box-shadow:0 20px 70px #1235}dialog::backdrop{background:#1237}#toast{position:fixed;bottom:24px;right:24px;max-width:600px;background:var(--navy);color:white;padding:14px 22px;border-radius:9px;z-index:10;display:none}.empty{padding:65px 20px;text-align:center}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);margin-right:5px}.dot.green{background:var(--green)}footer{color:var(--muted);font-size:12px;margin-top:25px}.help p{max-width:1000px}.checklist{line-height:1.9}a{color:var(--blue)}@media(max-width:1490px){main,nav{margin-left:24px;margin-right:24px}}@media(max-width:800px){header{align-items:flex-start}.bank{max-width:40%}.kpis{grid-template-columns:1fr 1fr}.split,.formgrid{grid-template-columns:1fr}nav{overflow:auto}nav button{white-space:nowrap}main,nav{margin-left:14px;margin-right:14px}.kpi b{font-size:23px}.card{padding:15px}}@media print{nav,.toolbar,button,footer{display:none!important}main{margin:0}.scroll{max-height:none;overflow:visible}body{background:white}.card{break-inside:avoid}table{font-size:9px}}
</style></head><body><header><div class="brand"><div class="mark">КВ</div><div><div class="eyebrow">Группа компаний</div><h1 id="group">Наименование группы компаний</h1><span class="muted">Кредитная выборка и покрытие эскроу</span></div></div><div class="bank"><div class="eyebrow">Финансирующая организация</div><strong id="bank">ПАО Сбербанк</strong></div></header><nav><button class="active" data-tab="home">Главная страница</button><button data-tab="fixed">Постоянные данные</button><button data-tab="current">Данные на дату расчёта</button></nav><main id="app"></main><div id="toast" role="status"></div><dialog id="passDialog"><form id="passForm"><h3>Изменить пароль раздела</h3><label>Новый пароль (не менее 8 символов)<input type="password" id="newPass" minlength="8" required autocomplete="new-password"></label><label>Повторите пароль<input type="password" id="repeatPass" minlength="8" required autocomplete="new-password"></label><div class="toolbar"><button class="primary">Сохранить пароль</button><button type="button" onclick="document.querySelector('#passDialog').close()">Отмена</button></div></form></dialog>
<script>
'use strict';
const KEY='escrow-drawdown-v1', VERSION=1, $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const schemes=[['credit','Ставка по кредиту','100%'],['mortgage','Ставка по ипотеке','0%'],['both','Ставка по кредиту и ипотеке','50%']];
const freshFixed=()=>({group:'',bank:'ПАО Сбербанк',projects:[],contracts:[],limits:[],totals:[]});
const freshCurrent=()=>({date:'2026-09-23',end:'2026-12-31',scenario:'Базовый сценарий',updated:'',assumption:false,checks:[],debts:[],escrows:[],receipts:[],draws:[]});
let disk={version:VERSION,vaults:{},report:null}, mem={fixed:null,current:null}, keys={},tab='home',dirty=false,selected='all',saveQueue=Promise.resolve();
try{let d=localStorage.getItem(KEY);if(d)disk=JSON.parse(d)}catch(e){setTimeout(()=>toast('Не удалось загрузить сохранение: '+e.message),0)}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',6500)}
function persist(){localStorage.setItem(KEY,JSON.stringify(disk))}
function bytes64(a){return btoa(String.fromCharCode(...a))}function from64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(section){const v=disk.vaults[section],iv=crypto.getRandomValues(new Uint8Array(12));const data=new TextEncoder().encode(JSON.stringify(mem[section]));v.iv=bytes64(iv);const encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},keys[section],data));let binary='';for(let i=0;i<encrypted.length;i+=16000)binary+=String.fromCharCode(...encrypted.subarray(i,i+16000));v.data=btoa(binary)}
async function unlock(section,p){if(!crypto.subtle)throw Error('Для шифрования откройте файл в актуальном Chrome или Edge.');const v=disk.vaults[section];if(v){keys[section]=await derive(p,from64(v.salt));try{mem[section]=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(v.iv)},keys[section],from64(v.data))))}catch{delete keys[section];throw Error('Неверный пароль или повреждённые данные.')}}else{if(p.length<8)throw Error('Пароль должен содержать не менее 8 символов.');const salt=crypto.getRandomValues(new Uint8Array(16));keys[section]=await derive(p,salt);mem[section]=section==='fixed'?freshFixed():freshCurrent();disk.vaults[section]={salt:bytes64(salt)};await seal(section);persist()}}
async function save(){saveQueue=saveQueue.catch(()=>{}).then(async()=>{for(const s of ['fixed','current'])if(mem[s])await seal(s);persist();dirty=false});return saveQueue}
function touch(){dirty=true;disk.report=null;header()}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function header(){const f=mem.fixed||disk.report?.branding;$('#group').textContent=f?.group||'Наименование группы компаний';$('#bank').textContent=f?.bank||'ПАО Сбербанк'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function render(){header();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')renderHome();else if(!mem[tab])renderLock();else renderEditor()}
function renderLock(){let exists=!!disk.vaults[tab];$('#app').innerHTML=`<section class="card lock"><div class="tag">Защищённый раздел</div><h2 style="margin-top:18px">${tab==='fixed'?'Постоянные данные':'Данные на дату расчёта'}</h2><p class="muted">${exists?'Введите пароль этого раздела для просмотра и редактирования.':'При первом вводе задайте пароль этого раздела. Для второго раздела можно выбрать другой пароль.'}</p><form id="unlock"><label>${exists?'Пароль':'Новый пароль · минимум 8 символов'}<input autofocus type="password" id="password" required ${exists?'':'minlength="8"'} autocomplete="${exists?'current-password':'new-password'}"></label>${exists?'':'<label>Повторите пароль<input type="password" id="confirm" required minlength="8" autocomplete="new-password"></label>'}<button class="primary" style="width:100%">${exists?'Открыть раздел':'Установить пароль и начать'}</button><p id="loginError" style="color:var(--red)" role="alert"></p></form><p class="muted" style="font-size:12px;margin-top:20px">Данные раздела сохраняются в браузере в зашифрованном виде. Восстановления забытого пароля нет. Главная сводка доступна без пароля.</p></section>`;$('#unlock').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{if(!exists&&$('#password').value!==$('#confirm').value)throw Error('Пароли не совпадают.');await unlock(tab,$('#password').value);render()}catch(e){$('#loginError').textContent=e.message;b.disabled=false}}}
const schemas={
projects:{section:'fixed',title:'Проекты',hint:'Уникальный код проекта и заёмщик. Эскроу разных проектов не смешивается.',fields:[['id','Код проекта'],['name','Наименование'],['borrower','Заёмщик']]},
contracts:{section:'fixed',title:'Договоры финансирования',hint:'Идентификатор договора — постоянный ключ связи. Лимиты задаются ниже с датой вступления в силу.',fields:[['id','ID договора'],['number','Номер договора'],['project','Проект','project']]},
totals:{section:'fixed',title:'Общие лимиты и оформленные изменения',hint:'Действующая сумма общего лимита в рублях. Одна строка на договор и дату. Основание — договор или уже оформленное соглашение.',fields:[['contract','Договор','contract'],['date','Действует с','date'],['amount','Общий лимит, ₽','money'],['basis','Документ-основание']]},
limits:{section:'fixed',title:'График открытия лимитов',hint:'Указывайте накопленный открытый лимит, а не прибавку. До первого этапа открытый лимит равен нулю.',fields:[['contract','Договор','contract'],['date','Начало этапа','date'],['amount','Накопленный лимит, ₽','money'],['basis','Документ-основание']]},
checks:{section:'current',title:'Полнота и сверка по проектам',hint:'Для каждого проекта подтвердите полноту обоих реестров и сверку с банком. При ожидаемом раскрытии или возврате укажите дату первого оттока: прогноз будет ограничен предыдущим днём.',fields:[['project','Проект','project'],['complete','Реестры полные','bool'],['reconciled','Сверено с банком','bool'],['outflow','Первый будущий отток','optionaldate'],['basis','Источник / пояснение']]},
debts:{section:'current',title:'Основной долг на дату',hint:'Готовые суммы из справки банка или ссудного счёта. Одна строка на договор, включая нулевой долг. Проценты и комиссии не включать.',fields:[['contract','Договор','contract'],['date','Дата долга','date'],['amount','Основной долг, ₽','money'],['basis','Источник']]},
escrows:{section:'current',title:'Остатки эскроу на дату',hint:'Банковский остаток, а не стоимость ДДУ. Одна строка на счёт, включая нулевой остаток. При отсутствии счетов подтвердите полный нулевой реестр в таблице сверки.',fields:[['account','ID счёта'],['sale','ID ДДУ'],['project','Проект','project'],['date','Дата остатка','date'],['scheme','Схема','scheme'],['amount','Остаток, ₽','money']]},
receipts:{section:'current',title:'Прогноз поступлений на эскроу',hint:'Только ещё не поступившие суммы. Каждая оплата рассрочки — отдельная строка. Меньший порядок означает более раннее событие; пустой порядок — после выборок.',fields:[['id','ID события'],['project','Проект','project'],['sale','ID ДДУ / продажи'],['date','Дата','date'],['amount','Поступление, ₽','money'],['scheme','Схема','scheme'],['order','Порядок','order'],['kind','Основание продажи','kind'],['status','Статус','status'],['basis','Документ / допущение']]},
draws:{section:'current',title:'План кредитных выборок',hint:'Полная потребность по платёжному календарю. Превышение не обрезается: модель показывает последствия всего плана. Пустой порядок — перед поступлениями.',fields:[['id','ID события'],['contract','Договор','contract'],['date','Дата','date'],['amount','Выборка, ₽','money'],['order','Порядок','order'],['status','Статус','status'],['basis','Основание / комментарий']]}
};
function options(type){if(type==='project')return (mem.fixed?.projects||[]).map(x=>[x.id,x.id+' · '+x.name]);if(type==='contract')return (mem.fixed?.contracts||[]).map(x=>[x.id,x.id+' · '+x.number]);if(type==='scheme')return schemes.map(s=>[s[0],s[1]]);if(type==='bool')return [['no','Нет'],['yes','Да']];if(type==='kind')return [['contract','Действующий ДДУ'],['future','Будущая продажа']];if(type==='status')return [['plan','План'],['done','Исполнено'],['cancel','Отменено']];return null}
function fieldHTML(table,row,field){const [key,label,type]=field,v=mem[schemas[table].section][table][row][key]??'',attrs=`data-table="${table}" data-row="${row}" data-field="${key}" aria-label="${esc(label)} строка ${row+1}"`;const opts=options(type);if(opts){let all=[...opts];if(v&&!all.some(o=>o[0]===v))all.push([v,v+' (не найдено / раздел закрыт)']);return `<select ${attrs}><option value="">Выберите…</option>${all.map(o=>`<option value="${esc(o[0])}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}return `<input ${attrs} type="${type==='date'||type==='optionaldate'?'date':'text'}" ${type==='money'||type==='order'?'inputmode="decimal"':''} value="${esc(v)}">`}
function editTable(name){const s=schemas[name],rows=mem[s.section][name];return `<section class="card"><div class="topline"><h3>${s.title}</h3><button data-add="${name}">+ Добавить строку</button></div><p class="muted">${s.hint}</p><div class="scroll"><table class="edit"><thead><tr><th>№</th>${s.fields.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${s.fields.map(f=>`<td>${fieldHTML(name,i,f)}</td>`).join('')}<td><button class="danger" data-remove="${name}" data-row="${i}" aria-label="Удалить строку ${i+1}">×</button></td></tr>`).join('')}</tbody></table>${!rows.length?'<p class="muted">Строк пока нет.</p>':''}</div></section>`}
function renderEditor(){const isFixed=tab==='fixed',d=mem[tab];$('#app').innerHTML=`<div class="topline"><div><h2>${isFixed?'Постоянные данные':'Данные на дату расчёта'}</h2><p class="muted">${isFixed?'Структура группы, договоры и условия финансирования':'Факт, подтверждения и будущий план'} · денежные значения в рублях</p></div><span class="tag good">Раздел открыт</span></div><div class="toolbar"><button id="save" class="primary">Сохранить раздел</button><button id="calculate" class="green">Пересчитать главную</button><button id="changePass">Изменить пароль</button><button id="lock">Закрыть раздел</button><button id="excelInputs">Исходные данные в Excel</button></div>${!mem.fixed&&!isFixed?'<div class="note warn">Для выбора проектов и договоров откройте «Постоянные данные». Уже сохранённые связи сохраняются.</div>':''}${isFixed?`<section class="card"><h3>Шапка главной страницы</h3><div class="formgrid"><label>Наименование группы компаний<input data-param="group" value="${esc(d.group)}"></label><label>Финансирующая организация<input data-param="bank" value="${esc(d.bank)}"></label></div></section>`:`<section class="card"><h3>Параметры расчёта</h3><div class="formgrid"><label>Дата фактических остатков<input type="date" data-param="date" value="${d.date}"></label><label>Конец прогноза<input type="date" data-param="end" value="${d.end}"></label><label>Версия сценария<input data-param="scenario" value="${esc(d.scenario)}"></label></div><p><label style="font-size:14px"><input type="checkbox" id="assumption" ${d.assumption?'checked':''}> Подтверждаю: основной долг равен всем выборкам с начала договора; погашения в прогнозе отсутствуют.</label></p><p class="muted">Смена даты не обновляет даты исходных строк. Исполненные события помечайте «Исполнено»; просроченный план не превращается в факт.</p><small>Последнее сохранение: ${esc(d.updated||'—')}</small></section>`}${Object.keys(schemas).filter(k=>schemas[k].section===tab).map(editTable).join('')}${isFixed?`<section class="card"><h3>Схемы субсидирования</h3>${table(['Схема','Коэффициент'],schemes.map(s=>[s[1],s[2]]))}<p class="muted">Коэффициенты и порог 100% закреплены техническим заданием и защищены от редактирования. Это правила данной модели.</p></section>`:''}<footer>Перед переходом к новому набору факта сохраните резервную копию текущего сценария на главной странице.</footer>`;
$('#app').querySelectorAll('[data-param]').forEach(el=>el.onchange=()=>{d[el.dataset.param]=el.value;touch()});if(!isFixed)$('#assumption').onchange=e=>{d.assumption=e.target.checked;touch()};
$('#app').querySelectorAll('[data-table]').forEach(el=>el.onchange=()=>{d[el.dataset.table][+el.dataset.row][el.dataset.field]=el.value;touch()});
$('#app').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let k=b.dataset.add,r={};schemas[k].fields.forEach(([key,,t])=>r[key]=t==='status'?'plan':t==='bool'?'no':t==='date'?(mem.current?.date||'2026-09-23'):'');d[k].push(r);touch();renderEditor()});
$('#app').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Удалить строку '+(+b.dataset.row+1)+'?')){d[b.dataset.remove].splice(+b.dataset.row,1);touch();renderEditor()}});
$('#save').onclick=async()=>{try{if(mem.current)mem.current.updated=new Date().toLocaleString('ru-RU');await save();toast('Данные зашифрованы и сохранены.');renderEditor()}catch(e){toast('Не удалось сохранить: '+e.message)}};
$('#lock').onclick=async()=>{try{await save();mem[tab]=null;delete keys[tab];render()}catch(e){toast(e.message)}};$('#calculate').onclick=recalculate;$('#changePass').onclick=()=>{$('#passForm').reset();$('#passDialog').showModal()};$('#excelInputs').onclick=()=>exportInputs(tab);

map(p=>[p.name,...p.buckets.map(x=>fmt(x)),fmt(p.actual),fmt(p.E)]))}</details><details><summary>Расшифровка остатков лимитов по договорам</summary>${table(['Проект','ID договора','Номер','Долг, ₽','Открытый, ₽','Общий, ₽','Остаток открытого, ₽','Остаток общего, ₽'],r.contracts.filter(p=>selected==='all'||p.project===selected).map(k=>[k.project,k.contract,k.number,...['D','L','T','R','G'].map(x=>fmt(k[x]))]))}</details></section><section class="card"><h3>Месячная сводка</h3><p class="muted">Поступления и выборки — обороты; остальные суммы — остатки на дату среза. Первый месяц содержит только прогноз после даты факта.</p>${table(monthHeads,monthlyRows(months))}</section><section class="card"><h3>Событийный прогноз</h3><p class="muted">Этапы действуют с начала дня. Если порядок не задан хотя бы для одного денежного события дня, все поступления этого дня учитываются после выборок. При равном порядке выборка идёт первой.</p>${table(eventHeads,eventRows(events))}</section><section class="card"><h3>Контроль исходных данных · ${issues.length}</h3>${issues.length?table(['Тип','Проект','Исходная таблица / строка','Сообщение'],issues.map(e=>[e.type,e.project,e.where,e.msg])):'<span class="tag good">Структурных ошибок не обнаружено</span>'}<p class="muted">Для проверки конкретной исходной строки откройте соответствующий защищённый раздел. Отчёт содержит идентификаторы и номера строк.</p></section>`:`<section class="card empty"><div class="tag">Автономный HTML-шаблон</div><h2 style="margin-top:18px">От исходных данных — к решению о выборке</h2><p class="muted">1. Добавьте проекты и лимиты. 2. Внесите остатки и план. 3. Пересчитайте сводку.</p><p class="muted">При первом открытии каждого раздела вам будет предложено установить пароль.</p></section>`}<section class="card help"><details><summary>Инструкция, формулы и контрольные примеры</summary><p><b>Начало работы.</b> Откройте «Постоянные данные», установите пароль, заполните шапку, проекты, договоры, общие лимиты и этапы открытия. В разделе «Данные на дату расчёта» задайте второй пароль, дату и горизонт; внесите сверку по каждому проекту, долг, эскроу, поступления и выборки. Нулевые суммы вводите явно. Пустые значения не считаются нулём. Основания строк обязательны.</p><p><b>Сохранение.</b> Нажимайте «Сохранить раздел» после редактирования. Для расчёта нужны оба открытых раздела. Пароли можно менять внутри открытого раздела. Данные сохраняются только в этом браузере; перенос HTML сам по себе не переносит введённые данные. Регулярно скачивайте резервную копию JSON. Она содержит зашифрованные исходные данные и открытую итоговую сводку. Для восстановления нужны прежние пароли. Очистка браузера может удалить локальные данные.</p><p><b>Доступ.</b> Пароли шифруют исходные таблицы каждого раздела (AES-GCM, PBKDF2). Главная страница, отчёт Excel и итоговая часть резервной копии доступны без пароля. Это локальный инструмент без пользователей и серверного разграничения прав. Не передавайте открытый отчёт тем, кому нельзя видеть итоги. По завершении нажмите «Закрыть оба раздела».</p><p><b>Обновление даты.</b> Сначала сохраните копию прежнего сценария. Обновите даты и суммы долга и эскроу, сверку и версию сценария. Исполненные или отменённые события отметьте соответствующим статусом. План с датой в периоде факта исключается с предупреждением. Для исторического расчёта загрузите соответствующий набор данных.</p><p><b>Формулы.</b> E = сумма остатков эскроу × коэффициент (100%, 0%, 50%). D = сумма долга договоров проекта. H = max(0, E − D). Vоткр = min(H, сумма открытых лимитов − D). Vобщ = min(H, сумма общих лимитов − D). Дополнительный потенциал = Vобщ − Vоткр. Покрытие = E / D. При D = 0 — «Нет задолженности». Итоговая выборка округляется вниз до копейки; промежуточные суммы сохраняют половину копейки при коэффициенте 50%.</p><p><b>Границы модели.</b> Линии невозобновляемые; долг равен накопленным выборкам; погашений нет. Эскроу не распределяется по договорам. Будущие оттоки не моделируются, горизонт ограничивается днём до первого оттока. Проценты, комиссии и прочие банковские условия не учитываются. Коэффициенты — условия ТЗ, а не универсальные правила банка.</p><p><b>Excel.</b> Кнопка главной страницы выгружает все проекты и все формы отчёта в настоящий файл XLSX со значениями, без формул. Исходные таблицы экспортируются отдельной кнопкой только из открытого раздела. Файлы Excel не защищены паролем. Для точного переноса сценария используйте JSON, а не Excel.</p><p><b>Контрольный пример «Факт».</b> E = 400, D = 300, открыто = 370, всего = 550 млн ₽. Ожидается Vоткр = 70; Vобщ = 100; дополнительный потенциал = 30; покрытие = 133,33%; после вариантов — 108,11% и 100%.</p><p><b>Контрольный пример «Прогноз».</b> Один договор. 5 октября +60 × 50%; 10 октября выборка 60; 15 октября открыто 450; 20 октября +40 × 100%; 25 октября выборка 80 млн ₽. Ожидаются долг 360 и 440; эскроу 430 и 470; оставшаяся доступная выборка 10 и 10 млн ₽.</p><div class="toolbar"><button id="demoFact">Загрузить пример «Факт»</button><button id="demoForecast">Загрузить пример «Прогноз»</button></div><p class="muted">Пример заменит текущие исходные таблицы после подтверждения. Оба раздела должны быть открыты. Перед заменой сохраните резервную копию.</p></details></section><footer>Версия 1.0 · По техническому заданию от 23.09.2026 · Суммы хранятся в рублях · Без подключения к банку</footer>`;

function xlsx(name,sheets){const files={},ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main',rel='http://schemas.openxmlformats.org/package/2006/relationships';files['[Content_Types].xml']=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;files['_rels/.rels']=`<Relationships xmlns="${rel}"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;files['xl/workbook.xml']=`<workbook xmlns="${ns}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xml(s.name.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;files['xl/_rels/workbook.xml.rels']=`<Relationships xmlns="${rel}">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;files['xl/styles.xml']=`<styleSheet xmlns="${ns}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1856A5"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="center"/></xf><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
sheets.forEach((s,i)=>{const rows=[s.headers,...s.rows];files[`xl/worksheets/sheet${i+1}.xml`]=`<worksheet xmlns="${ns}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${s.headers.map((h,j)=>`<col min="${j+1}" max="${j+1}" width="${Math.min(38,Math.max(18,h.length*.8))}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,k)=>`<row r="${k+1}" ${k===0?'ht="44" customHeight="1"':''}>${r.map((v,j)=>{let addr=col(j)+(k+1);return typeof v==='number'&&Number.isFinite(v)?`<c r="${addr}" s="${k===0?1:2}"><v>${v}</v></c>`:`<c r="${addr}" t="inlineStr" s="${k===0?1:0}"><is><t xml:space="preserve">${xml(v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData><autoFilter ref="A1:${col(s.headers.length-1)}${Math.max(1,rows.length)}"/></worksheet>`});download(name,zip(files))}
function exportReport(){const r=disk.report;if(!r)return;const sheets=[{name:'Параметры',headers:['Параметр','Значение'],rows:[['Группа компаний',r.branding.group],['Финансирующая организация',r.branding.bank],['Дата факта',r.date],['Конец прогноза',r.end],['Сценарий',r.scenario],['Рассчитано',r.created],['Единица','Рубли'],['Тип выгрузки','Зафиксированные значения, без формул'],['Важно','Открытая выборка и общий потенциал не складываются'],['Источник','ТЗ от 23.09.2026']]},{name:'Факт по проектам',headers:factualHeads,rows:r.projects.map(p=>[p.id,p.name,p.error?'Ошибка данных':p.verified?'Проверено':'Непроверено',...moneyFields.map(k=>numeric(p[k])),p.error?'—':pctText(p.coverage),p.error?'—':pctText(p.afterOpen),p.error?'—':pctText(p.afterTotal),p.status])},{name:'Эскроу по схемам',headers:['Проект',...schemes.map(s=>s[1]+', ₽'),'Всего, ₽','Учтено, ₽','Исключено, ₽'],rows:r.projects.filter(p=>!p.error).map(p=>[p.name,...p.buckets.map(numeric),numeric(p.actual),numeric(p.E),numeric(p.excluded)])},{name:'Лимиты договоров',headers:['Проект','ID договора','Номер','Долг, ₽','Открытый, ₽','Общий, ₽','Остаток открытого, ₽','Остаток общего, ₽'],rows:r.contracts.map(k=>[k.project,k.contract,k.number,...['D','L','T','R','G'].map(x=>numeric(k[x]))])},{name:'Событийный прогноз',headers:eventHeads,rows:eventRows(r.events,true)},{name:'Месячные итоги',headers:monthHeads,rows:monthlyRows(r.months,true)},{name:'Контроль',headers:['Тип','Проект','Строка / таблица','Сообщение'],rows:[...r.errors.map(e=>['Ошибка',e.project,e.where,e.msg]),...r.warnings.map(e=>['Проверка',e.project,e.where,e.msg])]}];xlsx('Расчёт_кредитной_выборки_'+r.date+'.xlsx',sheets)}
function exportInputs(section){if(!mem[section])return;const sheets=Object.entries(schemas).filter(([k,s])=>s.section===section).map(([k,s])=>({name:s.title,headers:s.fields.map(f=>f[1]),rows:mem[section][k].map(r=>s.fields.map(([key,,t])=>{if(t==='money'){try{return numeric(money(r[key]))}catch{return r[key]}}const op=options(t);return op?.find(x=>x[0]===r[key])?.[1]||r[key]}))}));sheets.unshift({name:'Параметры',headers:['Поле','Значение'],rows:section==='fixed'?[['Группа компаний',mem.fixed.group],['Банк',mem.fixed.bank]]:[['Дата факта',mem.current.date],['Конец прогноза',mem.current.end],['Сценарий',mem.current.scenario],['Долг равен накопленным выборкам',mem.current.assumption?'Да':'Нет'],['Обновлено',mem.current.updated]]});xlsx((section==='fixed'?'Постоянные_данные':'Данные_на_дату')+'.xlsx',sheets)}
render();
</script></body></html>
